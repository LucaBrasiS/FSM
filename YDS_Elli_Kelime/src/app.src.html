<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<meta name="theme-color" content="#5B3DF5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Basamak">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
</head>
<body>
<!-- APP:BEGIN -->
<title>Basamak YDS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Sans:opsz,wght@9..40,400..700&display=swap">
<style>
/* Yerleşim: tek sütunluk telefon uygulaması. Fosforlu kalem renkleri kelime türünü kodlar (fiil mavi, isim nane,
   sıfat turuncu, zarf lila, bağlaç pembe, öbek fiil limon); basılabilen her şey kalın çerçeveli, gölgeli bir etiket
   gibi durur ve basınca çöker. Şıklar optik formdaki A–E balonlarıdır. */
:root{
  --bg:#F1EEFF; --surface:#FFFFFF; --sunk:#E3DDFB;
  --ink:#17132B; --muted:#5E5880; --edge:#17132B;
  --brand:#5B3DF5; --on-brand:#FFFFFF; --brand-soft:#DED6FF; --hero-track:#7B63F7;
  --sun:#FFD43B; --on-fill:#17132B;               /* parlak dolguların üstündeki yazı her temada koyu */
  --ok:#5FE08A; --no:#FF8589;
  --p-v:#72B7FF; --p-n:#5EE0C0; --p-adj:#FFA552; --p-adv:#B9A0FF; --p-bag:#FF8FC4; --p-phr:#C6F04D;
  --shadow:rgba(23,19,43,.28);
  --display:"Bricolage Grotesque","DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ui:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:18px; --r-s:14px; --lift:4px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#120F24; --surface:#1F1A3D; --sunk:#2B2553;
    --ink:#F4F1FF; --muted:#ABA4D4; --edge:#05030D;
    --brand:#6A4DFA; --on-brand:#FFFFFF; --brand-soft:#2E2670; --hero-track:#8067FB;
    --sun:#FFD43B; --on-fill:#17132B;
    --ok:#5FE08A; --no:#FF8589;
    --p-v:#72B7FF; --p-n:#5EE0C0; --p-adj:#FFA552; --p-adv:#B9A0FF; --p-bag:#FF8FC4; --p-phr:#C6F04D;
    --shadow:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#120F24; --surface:#1F1A3D; --sunk:#2B2553;
  --ink:#F4F1FF; --muted:#ABA4D4; --edge:#05030D;
  --brand:#6A4DFA; --on-brand:#FFFFFF; --brand-soft:#2E2670; --hero-track:#8067FB;
  --sun:#FFD43B; --on-fill:#17132B;
  --ok:#5FE08A; --no:#FF8589;
  --p-v:#72B7FF; --p-n:#5EE0C0; --p-adj:#FFA552; --p-adv:#B9A0FF; --p-bag:#FF8FC4; --p-phr:#C6F04D;
  --shadow:rgba(0,0,0,.6);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
h1,h2,p,ul{margin:0}
ul{padding:0;list-style:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
button:focus-visible,summary:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.hero button:focus-visible{outline-color:var(--on-brand)}
svg{flex:none}
h2{font-size:.78rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.note{font-size:.9rem;color:var(--muted)}

#app{height:100%;max-width:30rem;margin:0 auto;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{flex:none;display:flex;align-items:center;gap:10px;padding-block:12px 10px;min-height:62px}
.body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:14px;
  margin-inline:-8px;padding-inline:8px;padding-block:2px 18px;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.body>*{flex:none}
.foot{flex:none;display:flex;gap:10px;padding-block:10px 18px}

/* marka */
.brand{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:800;font-size:1.22rem;letter-spacing:-.02em}
.mark{display:inline-flex}
.mark i{width:14px;height:14px;border-radius:50%;border:2px solid var(--edge);margin-left:-5px}
.mark i:nth-child(1){margin-left:0;background:var(--p-v)}
.mark i:nth-child(2){background:var(--p-n)}
.mark i:nth-child(3){background:var(--sun)}
.mark i:nth-child(4){background:var(--p-bag)}
.mark i:nth-child(5){background:var(--p-adv)}
.bsub{font-size:.7rem;letter-spacing:.08em;background:var(--sun);color:var(--on-fill);border:2px solid var(--edge);border-radius:8px;padding:0 6px}
.streak{margin-left:auto;display:inline-flex;align-items:center;gap:4px;font-family:var(--display);font-weight:700;font-size:.85rem;
  background:var(--p-adj);color:var(--on-fill);border:2px solid var(--edge);border-radius:999px;padding:3px 10px;font-variant-numeric:tabular-nums}

/* düğmeler: basınca çöken etiket */
.btn{flex:1;min-height:56px;border-radius:var(--r);padding:8px 18px;font-family:var(--display);font-weight:700;font-size:1.08rem;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;color:var(--ink);
  border:2px solid var(--edge);box-shadow:0 var(--lift) 0 var(--edge);transition:transform .06s ease,box-shadow .06s ease}
.btn:active:not([disabled]){transform:translateY(var(--lift));box-shadow:0 0 0 var(--edge)}
.btn.pri{background:var(--sun);color:var(--on-fill)}
.btn.sec{background:var(--surface)}
.btn.ghost{background:transparent;color:var(--muted);border-color:var(--muted);border-style:dashed;box-shadow:none}
.btn.ghost:active:not([disabled]){transform:none;box-shadow:none}
.btn[disabled]{background:var(--sunk);color:var(--muted);border-color:var(--muted);box-shadow:none;cursor:default}
.btn.pinbtn{flex:0 0 auto;min-width:7.6rem;background:var(--surface)}
.btn.pinbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.btn.narrow{flex:0 0 auto;padding-inline:14px}
.btn.narrow+.btn{padding-inline:10px}
.btn small{font-family:var(--ui);font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:2px solid currentColor;border-radius:6px;padding:0 5px}

/* kartlar */
.card{background:var(--surface);border:2px solid var(--edge);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.hero{background:var(--brand);color:var(--on-brand);border:2px solid var(--edge);border-radius:24px;padding:18px 18px 20px;
  display:flex;flex-direction:column;gap:14px;box-shadow:0 6px 0 var(--edge);margin-bottom:6px}
.hero .eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;opacity:.92}
.hero h1{font-family:var(--display);font-weight:800;font-size:2.2rem;line-height:1.02;letter-spacing:-.025em;text-wrap:balance}
.hero h2{color:var(--on-brand);font-family:var(--display);font-size:1.2rem;font-weight:800;letter-spacing:-.01em;text-transform:none}
.hero .hnote{font-size:.92rem;opacity:.94}
.mixcap{display:flex;justify-content:space-between;gap:8px;font-size:.76rem;font-weight:700;margin-bottom:5px;font-variant-numeric:tabular-nums}
.mix{height:20px;border-radius:10px;background:var(--hero-track);border:2px solid var(--edge);display:flex;overflow:hidden}
.mix i{display:block;height:100%}
.mix i+i{border-left:2px solid var(--edge)}
.mix .r{background:var(--p-bag)}
.mix .k{background:var(--sun)}
.mix .n{background:var(--on-brand)}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:.92rem;font-weight:600;margin-top:9px;font-variant-numeric:tabular-nums}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--edge)}
.dot.r{background:var(--p-bag)}
.dot.k{background:var(--sun)}
.dot.n{background:var(--on-brand)}

/* ana sayfa */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:var(--surface);border:2px solid var(--edge);border-radius:var(--r);padding:12px 8px 10px}
.wd{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:.72rem;font-weight:700;color:var(--muted)}
.wd i{width:32px;height:32px;border-radius:50%;border:2px solid var(--edge);background:var(--sunk);display:grid;place-items:center;color:var(--on-fill)}
.wd.done i{background:var(--ok)}
.wd.today{color:var(--ink)}
.wd.today i{box-shadow:0 0 0 2px var(--surface),0 0 0 5px var(--brand)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stats div{border:2px solid var(--edge);border-radius:var(--r-s);padding:10px 8px 9px;display:flex;flex-direction:column;gap:1px;min-width:0;color:var(--on-fill)}
.stats b{font-family:var(--display);font-weight:800;font-size:1.5rem;line-height:1.05;font-variant-numeric:tabular-nums}
.stats span{font-size:.74rem;font-weight:600}
.stats .c1{background:var(--p-n)}
.stats .c2{background:var(--p-bag)}
.stats .c3{background:var(--p-adj)}
.stats .c4{background:var(--p-v)}
.stats.three{grid-template-columns:repeat(3,1fr)}
.stats .g{background:var(--ok)}
.stats .b{background:var(--no)}
.stats .w{background:var(--on-brand)}
.tip{background:var(--p-phr);color:var(--on-fill);border:2px solid var(--edge);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px;transform:rotate(-.6deg)}
.tip h2{color:var(--on-fill)}
.tip p{font-size:1rem;font-weight:500}
details.card{display:block;padding:0}
details.card summary{padding:14px 16px;font-family:var(--display);font-weight:700;font-size:1.02rem;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;border-radius:var(--r)}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:"+";font-size:1.4rem;line-height:1}
details.card[open] summary::after{content:"–"}
.how{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
.how li{font-size:.93rem;color:var(--muted);padding-left:18px;position:relative}
.how li::before{content:"";position:absolute;left:0;top:.42em;width:9px;height:9px;border-radius:50%;border:2px solid var(--edge);background:var(--sun)}
.how b{color:var(--ink);font-weight:700}
.demo{border:2px dashed var(--muted);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px 8px;padding-bottom:3px}
.tool{min-height:60px;padding:9px 12px;border-radius:var(--r-s);background:var(--surface);border:2px solid var(--edge);box-shadow:0 3px 0 var(--edge);
  display:flex;flex-direction:column;justify-content:center;gap:1px;min-width:0;transition:transform .06s ease,box-shadow .06s ease}
.tool:active:not([disabled]){transform:translateY(3px);box-shadow:0 0 0 var(--edge)}
.tool[disabled]{opacity:.45;cursor:default}
.tool b{font-family:var(--display);font-size:.95rem;font-weight:700}
.tool span{font-size:.76rem;color:var(--muted)}
.confirm{display:flex;flex-direction:column;gap:10px}
.confirm .row2{display:flex;gap:8px;padding-bottom:var(--lift)}
.confirm .btn{min-height:48px;font-size:.98rem}
.confirm .btn.danger{background:var(--no);color:var(--on-fill)}

/* ilerleme şeridi: her parça 10 kelime, aralarında bir cümle */
.x{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--edge);box-shadow:0 3px 0 var(--edge);margin-bottom:3px;transition:transform .06s ease,box-shadow .06s ease}
.x:active{transform:translateY(3px);box-shadow:0 0 0 var(--edge)}
.prog{flex:1;display:flex;gap:4px;align-items:center}
.seg{height:12px;border-radius:6px;background:var(--sunk);border:2px solid var(--edge);overflow:hidden;min-width:0}
.seg i{display:block;height:100%;background:var(--brand);transition:width .2s ease}
.count{flex:none;font-family:var(--display);font-size:.92rem;font-weight:700;font-variant-numeric:tabular-nums}
.combo{flex:none;font-family:var(--display);font-weight:800;font-size:.85rem;background:var(--sun);color:var(--on-fill);border:2px solid var(--edge);border-radius:999px;padding:1px 9px;font-variant-numeric:tabular-nums}

/* kelime kartı: üst şerit kelime türünün rengi */
.pv{--pc:var(--p-v)} .pn{--pc:var(--p-n)} .padj{--pc:var(--p-adj)} .padv{--pc:var(--p-adv)} .pbag{--pc:var(--p-bag)} .pphr{--pc:var(--p-phr)} .psent{--pc:var(--sun)}
.wcard{background:var(--surface);border:2px solid var(--edge);border-radius:22px;overflow:hidden;display:flex;flex-direction:column}
.wband{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:48px;padding:6px 8px 6px 16px;background:var(--pc);color:var(--on-fill);border-bottom:2px solid var(--edge);
  font-family:var(--display);font-weight:800;font-size:.84rem;letter-spacing:.07em;text-transform:uppercase}
.tag{display:inline-flex;align-items:center;gap:4px;font-family:var(--ui);font-size:.72rem;font-weight:700;letter-spacing:.02em;text-transform:none;background:var(--on-fill);color:var(--on-brand);border-radius:999px;padding:2px 10px}
.spk{margin-left:auto;flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--on-brand);color:var(--on-fill);border:2px solid var(--edge)}
.spk.on{background:var(--on-fill);color:var(--on-brand)}
.wbody{padding:16px;display:flex;flex-direction:column;gap:10px}
.hw{font-family:var(--display);font-weight:800;font-size:2.4rem;line-height:1.02;letter-spacing:-.025em;overflow-wrap:anywhere}
.mean{font-size:1.18rem;font-weight:700}
.syn{font-size:.94rem;color:var(--muted)}
.syn span{color:var(--ink);font-weight:600}
.ex{font-size:1.14rem;line-height:1.6;font-weight:500}
.ex.big{font-size:1.26rem}
.ex mark{background:var(--pc);color:var(--on-fill);font-weight:700;padding:.05em .28em;border-radius:6px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.blank{display:inline-block;width:4.8em;height:1.3em;border-radius:7px;background:var(--pc);border:2px dashed var(--edge);vertical-align:-.3em;margin:0 .1em}
.tr{font-size:.96rem;color:var(--muted)}
.rule{height:2px;background:var(--sunk);border:0;margin:2px 0}
.lbl{font-size:.78rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.trbig{font-size:1.16rem;font-weight:600;line-height:1.4}

/* şıklar: optik form balonları */
.ask{font-family:var(--display);font-weight:700;font-size:1.06rem}
.opts{display:flex;flex-direction:column;gap:11px;padding-bottom:var(--lift)}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:8px 14px 8px 10px;font-weight:500;
  background:var(--surface);border:2px solid var(--edge);border-radius:var(--r-s);box-shadow:0 var(--lift) 0 var(--edge);transition:transform .06s ease,box-shadow .06s ease}
button.opt:active{transform:translateY(var(--lift));box-shadow:0 0 0 var(--edge)}
.bub{flex:none;width:32px;height:32px;border-radius:50%;border:2px solid var(--edge);background:var(--sunk);display:grid;place-items:center;font-family:var(--display);font-size:.85rem;font-weight:800}
.otxt{flex:1;min-width:0;overflow-wrap:anywhere;font-size:1.02rem}
.otxt.en{font-weight:600;font-size:1.08rem}
.opt.ok{background:var(--ok);color:var(--on-fill)}
.opt.no{background:var(--no);color:var(--on-fill)}
.opt.ok .bub,.opt.no .bub{background:var(--on-brand);color:var(--on-fill)}
.opt.picked .bub{background:var(--on-fill);color:var(--on-brand)}
.opt .ic{flex:none;display:grid;place-items:center}

/* cevap sonrası */
.res{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap}
.res b{font-family:var(--display);font-weight:800;font-size:1.12rem;padding:3px 14px;border-radius:999px;border:2px solid var(--edge);color:var(--on-fill)}
.res.ok b{background:var(--ok)}
.res.no b{background:var(--no)}
.res span{font-size:.94rem;color:var(--muted);font-weight:500}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.14)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.res.fresh.ok b{animation:pop .3s ease-out}
.res.fresh.no b{animation:shake .3s ease-out}

/* cümle kurma */
.zone{min-height:124px;padding:12px 12px 15px;border:2px dashed var(--muted);border-radius:var(--r);background:var(--sunk);
  display:flex;flex-wrap:wrap;gap:11px 8px;align-content:flex-start;align-items:flex-start;transition:border-color .12s ease,background-color .12s ease}
.zone.hot{border-color:var(--brand);background:var(--brand-soft)}
.zone .hint{margin:auto;align-self:center;font-size:.94rem;font-weight:500;color:var(--muted);text-align:center;padding:28px 0}
.zone.hot .hint{display:none}
.zone.ok,.zone.no{border-style:solid;border-color:var(--edge)}
.bank{display:flex;flex-wrap:wrap;gap:11px 8px;justify-content:center;min-height:54px;padding-bottom:3px}
.tile,.slot{font-size:1.08rem;font-weight:600;line-height:1.25;padding:10px 14px;min-height:46px;border-radius:12px;display:inline-flex;align-items:center;border:2px solid var(--edge)}
.tile{background:var(--surface);box-shadow:0 3px 0 var(--edge);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab}
.tile.lift{opacity:.25}
.tile.ghost{position:fixed;left:0;top:0;z-index:50;pointer-events:none;margin:0;background:var(--sun);color:var(--on-fill);box-shadow:0 12px 26px var(--shadow);cursor:grabbing}
.tile.ok{background:var(--ok);color:var(--on-fill)}
.tile.no{background:var(--no);color:var(--on-fill)}
.tile[disabled]{cursor:default}
.slot{color:transparent;background:transparent;border-style:dashed;border-color:var(--muted);margin-bottom:3px;user-select:none;-webkit-user-select:none}
.ins{flex:none;width:6px;height:46px;border-radius:3px;background:var(--brand)}

/* gün özeti */
.party{position:relative;overflow:hidden;background:var(--sun);color:var(--on-fill);border:2px solid var(--edge);border-radius:24px;padding:18px 18px 20px;
  display:flex;flex-direction:column;gap:12px;box-shadow:0 6px 0 var(--edge);margin-bottom:6px}
.party .eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
.party h1{font-family:var(--display);font-weight:800;font-size:2.1rem;line-height:1.02;letter-spacing:-.025em}
.party .pnote{font-size:.94rem;font-weight:600}
.burst i{position:absolute;top:-22px;width:11px;height:16px;border:2px solid var(--edge);border-radius:3px;animation:fall 1.5s ease-out both}
@keyframes fall{0%{transform:translateY(0) rotate(0);opacity:1}80%{opacity:1}100%{transform:translateY(300px) rotate(340deg);opacity:0}}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:2px solid var(--sunk);min-height:52px}
.row:first-child{border-top:0}
.mk{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--edge);color:var(--on-fill)}
.mk.ok{background:var(--ok)}
.mk.no{background:var(--no)}
.rt{flex:1;min-width:0;display:flex;flex-direction:column}
.rt b{font-family:var(--display);font-size:1.06rem;font-weight:700;overflow-wrap:anywhere}
.rt span{font-size:.82rem;color:var(--muted);overflow-wrap:anywhere}
.pinb{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--edge);background:var(--surface)}
.pinb[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* görseller (Fluent Emoji) */
.art{display:block;flex:none;user-select:none;-webkit-user-select:none;pointer-events:none}
.streak .art{margin-block:-2px}
.herotop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:-10px}
.heroart{margin-block:-6px;transform:rotate(8deg)}
.tip h2{display:flex;align-items:center;gap:6px}

function clash(a,b){
  if(a.syn.indexOf(b.w)>=0||b.syn.indexOf(a.w)>=0)return true;
  if(a.syn.some(function(s){return b.syn.indexOf(s)>=0}))return true;
  if(a.tok.some(function(s){return b.tok.indexOf(s)>=0}))return true;
  return CONF.some(function(p){return(p[0]===a.w&&p[1]===b.w)||(p[1]===a.w&&p[0]===b.w)});
}

/* Öğretim sırası herkes için aynı: sabit tohumla karıştırılmış kelime listesi */
var ORDER=shuffle(WORDS.map(function(x){return x.w}),rng(5060));

/* ---- durum ----
   kelime: st 1 = yarın tekrar, 2 = öğrenildi (chk gününde pekiştirme), 3 = kalıcı; lv = geçilen pekiştirme sayısı */
function dayNow(off){var n=new Date();return Math.floor((n.getTime()-n.getTimezoneOffset()*60000)/86400000)+(off|0)}
function fresh(){return{v:1,rev:0,off:0,first:null,w:{},ses:null,streak:0,last:null,days:[],g:{},gw:{},gr:{},gd:null,bg:{}}}
function sanitize(o){
  if(!Array.isArray(o.days))o.days=o.last!=null?[o.last]:[];
  if(!o.g||typeof o.g!=='object')o.g={};                 // gramer: ünite -> üç testin en iyi sonucu
  if(!o.gw||typeof o.gw!=='object')o.gw={};              // ünite -> yanlış yapılan soruların sırası
  if(!o.gr||typeof o.gr!=='object')o.gr={};              // ara tekrar testlerinin en iyi sonucu
  if(!o.gd||typeof o.gd!=='object')o.gd=null;
  if(!o.bg||typeof o.bg!=='object')o.bg={};              // bağlaç alıştırmaları: tür -> üç düzeyin en iyi sonucu            // günün grameri: {day, right, n}
  var ref=o.ses&&typeof o.ses.day==='number'?o.ses.day:dayNow(o.off);
  for(var k in o.w){
    if(!BY[k]){delete o.w[k];continue}
    var w=o.w[k];
    if(w.lv==null)w.lv=0;
    if(w.st===2&&w.chk==null)w.chk=ref+IVL[0];
  }
  var s=o.ses;
  if(s&&(!Array.isArray(s.q)||s.q.some(function(id){return!BY[id]})))o.ses=s=null;
  if(s){
    if(s.nChk==null)s.nChk=0;
    if(!s.base)s.base={};
    if(s.combo==null){s.combo=0;s.best=0}
    if(!s.md){s.md=[];s.mN=0;s.mMiss=0}
  }
  return o;
}
function load(){
  try{var j=localStorage.getItem(KEY);if(j){var o=JSON.parse(j);if(o&&o.v===1&&o.w)return sanitize(o)}}catch(e){}
  return fresh();
}
var S=load();
function save(){
  S.rev=(S.rev|0)+1;
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  pushCloud();
}
function today(){return dayNow(S.off)}
function dateOf(back){return new Date(Date.now()+((S.off|0)-(back|0))*86400000)}
function dateLabel(){
  try{return new Intl.DateTimeFormat('tr-TR',{day:'numeric',month:'long',weekday:'long'}).format(dateOf(0))}
  catch(e){return''}
}

/* ---- günlük plan ----
   1) dünün yanlışları ve sabitler, 2) yeni kelimeler (en çok BASE_NEW), 3) yer kalırsa pekiştirme. Toplam en fazla CAP. */
function plan(d){
  var due=[],chk=[],unseen=[];
  ORDER.forEach(function(id){
    var w=S.w[id];
    if(!w)unseen.push(id);
    else if(w.st===1&&w.due<=d)due.push(id);
    else if(w.st===2&&w.chk<=d)chk.push(id);
  });
  due.sort(function(a,b){return S.w[a].due-S.w[b].due});          // en eski önce
  chk.sort(function(a,b){return S.w[a].chk-S.w[b].chk});
  var rev=due.slice(0,CAP);
  var want=Math.min(BASE_NEW,unseen.length);
  var neu=unseen.slice(0,Math.min(want,CAP-rev.length));
  var kk=chk.slice(0,Math.max(0,CAP-rev.length-neu.length));
  return{rev:rev,chk:kk,neu:neu,revLate:due.length-rev.length,neuLate:want-neu.length};
}
function ensureSession(){
  var d=today();
  if(S.ses&&S.ses.day===d)return S.ses;
  var p=plan(d);
  if(!p.rev.length&&!p.neu.length&&!p.chk.length){if(S.ses){S.ses=null;save()}return null}
  if(S.first==null)S.first=d;
  S.ses={day:d,q:shuffle(p.rev).concat(shuffle(p.chk),p.neu),nRev:p.rev.length,nChk:p.chk.length,i:0,res:{},base:{},
         sd:[],sN:0,sOk:0,md:[],mN:0,mMiss:0,combo:0,best:0,revLate:p.revLate,neuLate:p.neuLate,done:false};
  save();
  return S.ses;
}
function kindAt(ses,i){return i<ses.nRev?'r':(i<ses.nRev+ses.nChk?'k':'n')}
/* Bugün sorulan kelimenin yarınını belirler; sabitleme değişince yeniden çağrılır, bu yüzden hep base üzerinden hesaplar */
function resched(id){
  var w=S.w[id],ses=S.ses;
  if(!w||!ses||!has(ses.res,id))return;
  var day=ses.day;
  if(ses.res[id]!==1||(ses.fres&&ses.fres[id]===0)){w.st=1;w.due=day+1;w.lv=0;return}   // bilemedi ya da gün sonunda yanıldı: yarın tekrar
  var lv=(ses.base[id]|0)+(kindAt(ses,ses.q.indexOf(id))==='k'?1:0);
  w.lv=lv;
  if(w.pin){w.st=1;w.due=day+1;return}                             // sabit: yarın yine
  if(lv>=IVL.length){w.st=3;return}                                // kalıcı
  w.st=2;w.chk=day+IVL[lv];
}
function mark(id,ok){
  var ses=S.ses;
  var w=S.w[id]||(S.w[id]={st:0,pin:0,due:0,chk:0,lv:0,n:0,x:0});
  if(!has(ses.base,id))ses.base[id]=w.lv|0;
  w.n++;if(!ok)w.x++;
  ses.res[id]=ok?1:0;ses.i++;
  if(ok){ses.combo++;if(ses.combo>ses.best)ses.best=ses.combo}else ses.combo=0;
  resched(id);
}
function togglePin(id){var w=S.w[id];if(!w)return;w.pin=w.pin?0:1;resched(id);save()}
function sentDue(ses){
  var i=ses.i,n=ses.q.length;
  if(i===0||ses.sd.indexOf(i)>=0)return false;
  if(i%BLOCK===0)return true;
  return i===n&&i%BLOCK>=5;
}
function sentWord(ses){
  var i=ses.i,len=(i%BLOCK)||BLOCK,blk=ses.q.slice(i-len,i);
  var bad=blk.filter(function(id){return ses.res[id]===0});
  var src=bad.length?bad:blk;
  return src[Math.floor(Math.random()*src.length)];
}
/* ara görevler: 5, 15, 25… kelimeden sonra eşleştirme; 10, 20, 30… kelimeden sonra cümle (sıralama ve tamamlama dönüşümlü) */
function matchDue(ses){var i=ses.i;return i>0&&i%BLOCK===HALF&&ses.md.indexOf(i)<0}
function matchIds(ses){
  var out=[];
  ses.q.slice(ses.i-HALF,ses.i).forEach(function(id){if(out.every(function(o){return!clash(BY[o],BY[id])}))out.push(id)});
  return out;
}
function sentMode(ses){return ses.i%BLOCK===0&&(ses.i/BLOCK)%2===0?'complete':'order'}
/* ---- yeni kelime tanıtımı (her 5 yeni kelimeden önce) ve gün sonu kontrolü ---- */
var IN=null;
function introDue(ses){
  var i=ses.i,start=ses.nRev+ses.nChk;
  if(i<start||i>=ses.q.length||(i-start)%HALF!==0)return false;
  return(ses.intro||[]).indexOf(i)<0;
}
function startIntro(ses){
  var start=ses.nRev+ses.nChk,ids=ses.q.slice(ses.i,Math.min(ses.q.length,ses.i+HALF)).filter(function(_,k){return ses.i+k>=start});
  IN={ids:ids,k:0,at:ses.i};Q=null;ST=null;M=null;view='intro';render();
}

    '<p class="mean">'+esc(x.tr)+'</p><p class="syn">Eş anlamlı: <span lang="en">'+esc(x.syn.join(' · '))+'</span></p><hr class="rule">'+

}
function finalList(ses){
  var start=ses.nRev+ses.nChk;
  return ses.q.slice(start).filter(function(id){return ses.res[id]===1});
}
function finalMark(id,ok){
  var ses=S.ses,w=S.w[id];
  ses.fres[id]=ok?1:0;ses.fi++;
  if(ok){ses.combo++;if(ses.combo>ses.best)ses.best=ses.combo}else ses.combo=0;
  if(w)resched(id);
}
function finalHead(ses,num){
  var n=ses.fq.length,segs='';
  for(var k=0;k<n;k++)segs+='<span class="seg" style="flex:1 1 0"><i style="width:'+(k<ses.fi?100:0)+'%"></i></span>';
  return '<header class="top"><button class="x" data-act="home" aria-label="Kelime ekranına dön">'+I.x+'</button>'+
    '<div class="prog fin" role="progressbar" aria-label="Gün sonu kontrolü" aria-valuemin="0" aria-valuemax="'+n+'" aria-valuenow="'+ses.fi+'">'+segs+'</div>'+
    '<span class="count">'+num+' / '+n+'</span></header>';
}

function finish(){
  var ses=S.ses;if(!ses||ses.done)return;
  ses.done=true;
  if(S.last!==ses.day){S.streak=(S.last===ses.day-1)?(S.streak|0)+1:1;S.last=ses.day}
  if(S.days.indexOf(ses.day)<0){S.days.push(ses.day);if(S.days.length>60)S.days=S.days.slice(-60)}
  save();
}
function tally(ses){
  var ok=0,no=0;
  for(var k in ses.res){if(ses.res[k])ok++;else no++}
  return{ok:ok,no:no};
}
function totals(){
  var learned=0,due=0,pin=0,seen=0,next=null;
  for(var k in S.w){
    seen++;var w=S.w[k];
    if(w.st>=2)learned++;else if(w.st===1)due++;
    if(w.pin)pin++;
    if(w.st===2&&(next===null||w.chk<next))next=w.chk;
  }
  return{learned:learned,due:due,pin:pin,left:WORDS.length-seen,next:next};
}

/* ---- soru üretimi ----
   tr = Türkçe karşılığını seç, en = İngilizcesini seç, blank = boşluk doldur, syn = eş anlamını bul,
   spell = parçalardan kelimeyi kur (klavyesiz yazma) */
var EXTRA=['of','to','on','in','for','with','up','out','about','from','at','by'];
function pieces(word){var n=word.length,k=n<=6?1:(n<=10?2:3),out=[];for(var i=0;i<n;i+=k)out.push(word.slice(i,i+k));return out}
/* Sürükle bırak alanı: ch = parçalar (ilk need tanesi doğru sırayla cevabı verir), order = alttaki diziliş, ans = yerleştirilenler */
function builder(ch,need){
  need=need==null?ch.length:need;
  var idx=ch.map(function(_,k){return k}),order=idx,goal=ch.slice(0,need).join('|'),tries=0;
  if(ch.length>1){do{order=shuffle(idx)}while(tries++<20&&order.slice(0,need).map(function(i){return ch[i]}).join('|')===goal)}
  return{ch:ch,order:order,ans:[],need:need};
}
function fmtFor(kind,w){
  if(kind==='n')return'tr';                                                       // ilk karşılaşma: cümleye bakıp anlamını seç
  if(kind==='r')return['blank','en','spell','tr'][Math.max(0,((w&&w.n)|0)-1)%4];  // her tekrarda başka bir tür
  return['syn','spell','en'][((w&&w.lv)|0)%3];                                    // pekiştirme seviyesine göre
}
function distract(t,n){
  var pool=shuffle(WORDS.filter(function(x){return x.pos===t.pos&&x.w!==t.w&&!clash(t,x)})),ds=[];
  pool.forEach(function(c){if(ds.length<n&&ds.every(function(o){return!clash(o,c)}))ds.push(c)});
  pool.forEach(function(c){if(ds.length<n&&ds.indexOf(c)<0)ds.push(c)});
  return ds;
}
function makeQ(id,kind,fmt){
  var t=BY[id];
  fmt=fmt||fmtFor(kind,S.w[id]);
  var q={id:id,kind:kind,fmt:fmt,opts:[],correct:-1,picked:null,ok:false,done:false,fresh:false,solo:false,b:null,sep:'',extra:0,tried:''};
  if(fmt==='spell'){
    var ws=t.w.split(' ');
    if(ws.length>1){                                   // öbek: doğru kelimeleri seç ve sırala, iki parça fazla
      var ex=shuffle(EXTRA.filter(function(e){return ws.indexOf(e)<0})).slice(0,2);
      q.b=builder(ws.concat(ex),ws.length);q.sep=' ';q.extra=ex.length;
    }else q.b=builder(pieces(t.w));
    return q;
  }
  var text=function(o){return fmt==='tr'?o.tr:(fmt==='syn'?o.syn[Math.floor(Math.random()*o.syn.length)]:o.w)};
  var right=text(t),opts=[right];
  distract(t,4).forEach(function(o){var s=text(o);if(opts.indexOf(s)<0)opts.push(s)});
  q.opts=shuffle(opts);q.correct=q.opts.indexOf(right);
  return q;
}

/* ---- ses: Claude sesi varsa o, yoksa tarayıcının kendi sesi ---- */
var V={app:false,t:null,web:null,busy:false,off:false};
function canSpeak(){return!V.off&&!!(V.app||V.t||V.web)}
function setBusy(b){
  V.busy=b;
  [].forEach.call(document.querySelectorAll('.spk'),function(n){n.classList.toggle('on',b);n.setAttribute('aria-label',b?'Sesi durdur':'Sesli dinle')});
}
function say(text){
  if(V.off||!text)return;
  if(V.app){try{window.KelimeApp.speak(text,0.92)}catch(e){}return}
  if(V.t){
    if(V.busy){V.t.stop().catch(function(){});return}
    V.t.speak(text,{language:'en',rate:0.92}).catch(function(e){
      var c=e&&e.code;
      if(c==='not_granted'||c==='unavailable'){V.off=true;render(true)}
    });
    return;
  }
  if(V.web){
    var ss=window.speechSynthesis;
    if(V.busy||ss.speaking){ss.cancel();setBusy(false);return}
    var u=new SpeechSynthesisUtterance(text);
    u.voice=V.web;u.lang=V.web.lang;u.rate=0.92;
    u.onstart=function(){setBusy(true)};
    u.onend=u.onerror=function(){setBusy(false)};
    ss.speak(u);
  }
}
function initVoice(){
  if(window.KelimeApp&&typeof window.KelimeApp.speak==='function'){V.app=true;return}   // Android sarmalayıcının kendi sesi
  var web=function(){
    try{
      var ss=window.speechSynthesis;
      if(!ss||typeof SpeechSynthesisUtterance!=='function')return;
      var pick=function(){
        if(V.t)return;
        var en=(ss.getVoices()||[]).filter(function(v){return/^en([-_]|$)/i.test(v.lang)});
        if(!en.length)return;
        var had=!!V.web;
        V.web=en.filter(function(v){return/GB/i.test(v.lang)})[0]||en.filter(function(v){return/US/i.test(v.lang)})[0]||en[0];
        if(!had&&view==='word')render(true);
      };
      pick();
      if(ss.addEventListener)ss.addEventListener('voiceschanged',pick);
    }catch(e){}
  };
  var c=window.claude;
  if(!c||typeof c.use!=='function'){web();return}
  c.use('tts').then(function(t){
    if(!t){web();return}
    V.t=t;
    try{t.onState(function(e){
      setBusy(e.state!=='idle');
      if(e.state==='idle'&&(e.reason==='not_granted'||e.reason==='unavailable')){V.off=true;render(true)}
    })}catch(e){}
    if(view==='word')render(true);
  },web);
}

function weekStrip(d){

}
function progHead(ses,num){
  var n=ses.q.length,segs='';
  for(var b=0;b*BLOCK<n;b++){
    var size=Math.min(BLOCK,n-b*BLOCK),fill=Math.max(0,Math.min(size,ses.i-b*BLOCK))/size*100;
    segs+='<span class="seg" style="flex:'+size+' 1 0"><i style="width:'+fill+'%"></i></span>';

/* cümle görevi: order = parçaları sırala, complete = cümlenin devamını seç */
function startSent(id,solo,mode){
  var x=BY[id],raw=x.en.split(' / ');
  if(mode==='complete'){
    var tail=function(o){return chunks(o.en).slice(2).join(' ')};
    var right=tail(x),opts=[right];
    distract(x,3).forEach(function(o){var s=tail(o);if(opts.indexOf(s)<0)opts.push(s)});
    opts=shuffle(opts);
    ST={id:id,mode:'complete',head:raw.slice(0,2).join(' / '),opts:opts,correct:opts.indexOf(right),picked:null,b:null,checked:false,ok:false,solo:!!solo};
  }else{
    var ch=chunks(x.en),last=ch.length-1;
    ch=ch.map(function(c,k){
      if(k===0&&!/^I\b/.test(c))c=c.charAt(0).toLowerCase()+c.slice(1);   // büyük harf ilk parçayı ele vermesin
      if(k===last)c=c.replace(/\.$/,'');
      return c;
    });
    ST={id:id,mode:'order',b:builder(ch),checked:false,ok:false,solo:!!solo};
  }
  Q=null;M=null;view='sent';render();
}
function vSent(){
  var x=BY[ST.id],ses=S.ses,comp=ST.mode==='complete';
  var head=ST.solo?soloHead(comp?'Cümle tamamlama':'Cümle sıralama'):progHead(ses,ses.i);
  var note=ST.solo?'':'<span class="tag">her '+BLOCK+' kelimede bir</span>';
  var full='<section class="wcard p'+x.pos+'"><div class="wbody"><p class="ex" lang="en">'+marked(x.en)+'</p></div></section>';
  var after=ST.solo?soloFoot(comp?'trycomp':'trysent',''):'<button class="btn pri" data-act="next" data-focus>Devam'+I.go+'</button>';
  if(comp){
    var rows='';
    if(!ST.checked){for(var k=0;k<ST.opts.length;k++)rows+=optRow(ST.opts[k],k,'',true,'','pickS')}
    else{
      rows=optRow(ST.opts[ST.correct],ST.correct,' ok'+(ST.picked===ST.correct?' picked':''),true,I.ok,'');
      if(ST.picked>=0&&ST.picked!==ST.correct)rows+=optRow(ST.opts[ST.picked],ST.picked,' no picked',true,I.no,'');
    }
    return head+'<div class="body">'+
      '<section class="wcard psent"><div class="wband"><span>Cümleyi tamamla</span>'+note+ui('t-sent',26)+'</div>'+
      '<div class="wbody"><p class="ex big" lang="en">'+marked(ST.head)+' …</p><p class="tr">'+esc(x.trs)+'</p></div></section>'+
      (ST.checked
        ?'<p class="res '+(ST.ok?'ok':'no')+' fresh" role="status"><b>'+(ST.picked===-1?'Cevap bu':(ST.ok?'Doğru!':'Yanlış'))+'</b><span>Cümlenin tamamı aşağıda.</span></p>'
        :'<p class="ask">Cümlenin devamı hangisi?</p>')+
      '<div class="opts">'+rows+'</div>'+(ST.checked?full:'')+'</div>'+
      '<footer class="foot">'+(ST.checked?after:'<button class="btn ghost" data-act="idkS">Bilmiyorum</button>')+'</footer>';
  }
  var b=ST.b,result='';
  if(ST.checked){
    result='<p class="res '+(ST.ok?'ok':'no')+' fresh" role="status"><b>'+(ST.ok?'Doğru!':'Sıra tutmadı')+'</b><span>'+(ST.ok?'Cümle tam böyle.':'Doğru sıralama aşağıda.')+'</span></p>'+full;
  }
  return head+'<div class="body">'+
    '<section class="wcard psent"><div class="wband"><span>Cümle kur</span>'+note+ui('t-sent',26)+'</div>'+
    '<div class="wbody"><p class="lbl">Bu cümleyi İngilizce kur</p><p class="trbig">'+esc(x.trs)+'</p></div></section>'+
    builderHTML(b,false,ST.checked?(ST.ok?'ok':'no'):'')+result+'</div>'+
    '<footer class="foot">'+(ST.checked?after:'<button class="btn pri" data-act="check"'+(b.ans.length===b.need?'':' disabled')+'>Kontrol et</button>')+'</footer>';

/* eşleştirme turu: son beş kelime ile anlamları */
function startMatch(ids,solo){
  M={ids:ids,left:shuffle(ids),right:shuffle(ids),l:null,r:null,done:{},miss:0,bad:false,fin:false,solo:!!solo};
  Q=null;ST=null;view='match';render();
}
function mPick(side,id){
  if(!M||M.bad||M.fin||M.done[id])return;
  if(side==='L')M.l=M.l===id?null:id;else M.r=M.r===id?null:id;
  if(!M.l||!M.r){render(true);return}
  if(M.l!==M.r){                                         // tutmadı: kısa bir sarsıntı, sonra seçim kalkar
    M.miss++;M.bad=true;render(true);
    var cur=M;
    setTimeout(function(){if(M!==cur)return;M.bad=false;M.l=M.r=null;if(view==='match')render(true)},420);
    return;
  }
  M.done[M.l]=true;M.l=M.r=null;
  if(Object.keys(M.done).length<M.ids.length){render(true);return}
  M.fin=true;
  if(!M.solo&&S.ses){var ses=S.ses;if(ses.md.indexOf(ses.i)<0)ses.md.push(ses.i);ses.mN++;ses.mMiss+=M.miss;save()}
  render();
}
function chipM(side,id,text,en){
  var done=M.done[id],sel=(side==='L'?M.l:M.r)===id;
  var cls=done?' done':(sel?(M.bad?' bad':' sel'):'');
  return '<button class="chipm'+(en?' en':'')+cls+'" data-act="m'+side+'" data-id="'+esc(id)+'"'+(en?' lang="en"':'')+(done?' disabled':'')+
    ' aria-pressed="'+(sel?'true':'false')+'"><span>'+esc(text)+'</span>'+(done?I.ok:'')+'</button>';
}
function vMatch(){
  var ses=S.ses,rows='';
  for(var k=0;k<M.ids.length;k++)rows+=chipM('L',M.left[k],BY[M.left[k]].w,true)+chipM('R',M.right[k],BY[M.right[k]].tr,false);
  var foot=!M.fin?'<button class="btn pri" disabled>Devam'+I.go+'</button>'
    :(M.solo?soloFoot('trymatch',''):'<button class="btn pri" data-act="next" data-focus>Devam'+I.go+'</button>');
  return (M.solo?soloHead('Eşleştirme'):progHead(ses,ses.i))+'<div class="body">'+
    '<section class="wcard pmatch"><div class="wband"><span>Eşleştir</span>'+(M.solo?'':'<span class="tag">her '+BLOCK+' kelimede bir</span>')+ui('t-match',26)+'</div>'+
    '<div class="wbody"><p class="trbig">Bir kelimeye, sonra anlamına dokun.</p></div></section>'+
    (M.fin?'<p class="res ok fresh" role="status"><b>Tamam!</b><span>'+(M.miss?M.miss+' yanlış deneme.':'Hepsi ilk denemede.')+'</span></p>':'')+
    '<div class="match">'+rows+'</div></div><footer class="foot">'+foot+'</footer>';
}

/* ---- gramer üniteleri ---- */
var UCOL=['--p-v','--p-n','--p-adj','--p-adv','--p-bag','--p-phr'];
function uColor(id){return /^b-/.test(id)?'--sun':UCOL[Math.max(0,UNITS.indexOf(id))%UCOL.length]}
function uLabel(id){
  var t=TOPIC[id];
  if(t.grp==='k')return 'Ünite '+t.no;
  if(t.grp==='b')return 'Bağlaç';
  return 'YDS '+(UNITS.filter(function(x){return TOPIC[x].grp!=='k'}).indexOf(id)+1);
}
/* [ana başlık, alt başlık, ana başlık İngilizce mi] : kitap ünitelerinde başlık kitaptaki İngilizce ad, altında Türkçesi */
function uName(id){
  var t=TOPIC[id];
  if(t.grp==='k')return[t.en,t.ad,true];
  var m=t.ad.match(/^(.*?)\s*\((.*)\)\s*$/);
  return m?[m[1],m[2],false]:[t.ad,'',false];
}
function gBest(id,k){var a=S.g[id];return a&&typeof a[k]==='number'?a[k]:null}
function gDone(){var n=0;UNITS.forEach(function(id){for(var k=0;k<TESTS.length;k++)if(gBest(id,k)!==null)n++});return n}
function nextTest(){
  for(var u=0;u<UNITS.length;u++)for(var k=0;k<TESTS.length;k++)if(gBest(UNITS[u],k)===null)return{id:UNITS[u],k:k};
  return null;
}
function starCount(n,of){return n>=of*0.9?3:(n>=of*0.7?2:(n>=of*0.5?1:0))}
function starRow(n,size){

function tabs(v){

/* ---- soru havuzları: [ünite, soru sırası] çiftleri. Okuma ünitesi parçasıyla birlikte anlamlı olduğundan karışık setlere girmez ---- */
function mixable(id){return!!GRAM.q[id]&&!(GRAM.pas&&GRAM.pas[id])}
function unitItems(id,k){var out=[];for(var i=k*TLEN;i<(k+1)*TLEN&&i<GRAM.q[id].length;i++)out.push([id,i]);return out}
function allItems(ids){
  var out=[];
  ids.filter(mixable).forEach(function(id){GRAM.q[id].forEach(function(_,i){out.push([id,i])})});
  return out;
}
function solvedItems(){
  var out=[];
  UNITS.filter(mixable).forEach(function(id){for(var k=0;k<TESTS.length;k++)if(gBest(id,k)!==null)out=out.concat(unitItems(id,k))});
  return out;
}
function wrongItems(){
  var out=[];
  for(var id in S.gw){
    if(!mixable(id)||!Array.isArray(S.gw[id]))continue;
    S.gw[id].forEach(function(i){if(GRAM.q[id][i])out.push([id,i])});
  }
  return out;
}
function take(pool,n,skip){
  var seen=Object.create(null),out=[];
  (skip||[]).forEach(function(it){seen[it[0]+':'+it[1]]=1});
  shuffle(pool).forEach(function(it){var key=it[0]+':'+it[1];if(out.length<n&&!seen[key]){seen[key]=1;out.push(it)}});
  return out;
}
/* tekrar soruları: önce daha önce yanlış yapılanlar, kalan yer çözülmüş testlerden rastgele */
function reviewItems(n,skip){
  var w=take(wrongItems(),n,skip);
  return w.length<n?w.concat(take(solvedItems(),n-w.length,(skip||[]).concat(w))):w;
}
/* günün grameri: sıradaki testin 10 sorusu + 5 karışık tekrar; bütün testler çözüldüyse 15 karışık tekrar */
function dailyPlan(){
  var nt=nextTest(),unit=nt?unitItems(nt.id,nt.k):[];
  var rev=reviewItems(nt?DAILY_REVIEW:TLEN+DAILY_REVIEW,unit);
  return{nt:nt,items:unit.concat(rev),unitN:unit.length,rev:rev.length};
}
function dailyDone(){return!!(S.gd&&S.gd.day===today())}

/* konu özeti: ## başlık, - madde, > örnek — çevirisi, **kalın**, *İngilizce terim* */
function inl(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i lang="en">$1</i>')}
function notes(md){
  var secs=[],cur=null;
  md.split('\n').forEach(function(line){
    var l=line.trim();
    if(!l)return;
    if(l.indexOf('## ')===0){cur={h:l.slice(3),rows:[]};secs.push(cur);return}
    if(!cur){cur={h:'Özet',rows:[]};secs.push(cur)}
    cur.rows.push(l);
  });
  return secs.map(function(s,k){
    var out='',ul=false;
    s.rows.forEach(function(l){
      var li=l.indexOf('- ')===0;
      if(li&&!ul){out+='<ul>';ul=true}
      if(!li&&ul){out+='</ul>';ul=false}
      if(li)out+='<li>'+inl(l.slice(2))+'</li>';
      else if(l.charAt(0)==='>'){
        var p=l.replace(/^>\s*/,'').split(' — ');
        out+='<p class="exm"><span lang="en">'+inl(p[0])+'</span>'+(p.length>1?'<span class="tr">'+inl(p.slice(1).join(' — '))+'</span>':'')+'</p>';
      }else out+='<p>'+inl(l)+'</p>';
    });
    if(ul)out+='</ul>';
    return '<details class="nsec"'+(k===0?' open':'')+'><summary>'+esc(s.h)+'</summary><div class="nbody">'+out+'</div></details>';
  }).join('');
}
function unitRow(id){
  var pips='',solved=0;
  for(var k=0;k<TESTS.length;k++){var b=gBest(id,k);if(b!==null)solved++;pips+='<i class="'+(b===null?'':(b>=TLEN*0.7?'ok':'try'))+'"></i>'}
  var nm=uName(id);
  return '<button class="urow" data-act="unit" data-id="'+id+'" style="--pc:var('+uColor(id)+')"><span class="uicon sm">'+ui('u-'+id,28)+'</span>'+
    '<span class="utxt"><span class="unum">'+uLabel(id)+'</span><b'+(nm[2]?' lang="en"':'')+'>'+esc(nm[0])+'</b></span>'+
    '<span class="pips" role="img" aria-label="'+TESTS.length+' testten '+solved+' tanesi çözüldü">'+pips+'</span></button>';
}
function vUnits(){

    (bagReady()?'<button class="ucard bagcard" data-act="bag"><span class="uicon">'+ui('u-b-iliski',40)+'</span><span class="utxt"><span class="unum">Özel çalışma</span><b>Bağlaç atölyesi</b><span class="usub">Zor cümleleri çözmek için bağlaçlar · kartlar, 3 alıştırma, Ayır oyunu</span></span>'+I.go+'</button>':'')+
    body+
    '<section class="card mixcard"><h2>Karışık test</h2><div class="tools">'+
    '<button class="tool" data-act="gmix" data-n="10" data-s="mine"'+(solvedItems().length>=10?'':' disabled')+'><b>10 soru</b><span>Çalıştığım ünitelerden</span></button>'+

/* ---- bağlaç atölyesi ----
   BAG.groups: ilişki grupları ve bağlaç kartları {w, y (yapı), tr, ex, ext, not}; BAG.yapi: yapı açıklamaları;
   BAG.qs: sec / iliski / anlam soruları [soru, şıklar, doğru, açıklama, tür, ek]. Sorular gramer setleriyle aynı motorda çözülür. */
var BAG=/*@@BAG@@*/{groups:[],yapi:{},qs:{}};
var BAGM=[
  {k:'sec',ad:'Bağlacı seç',sub:'Boşluğa uyan bağlacı bul',icon:'u-b-sec'},
  {k:'iliski',ad:'İlişkiyi bul',sub:'Bağlaç cümleye hangi anlamı katıyor',icon:'u-b-iliski'},
  {k:'anlam',ad:'Anlamı seç',sub:'Cümlenin doğru Türkçesini bul',icon:'u-b-anlam'}
];
var BLV=['Kolay','Orta','Zor'];
var BCOL={zitlik:'--p-bag',neden:'--p-v',sonuc:'--p-n',kosul:'--p-adj',amac:'--p-adv',zaman:'--p-phr',ekleme:'--sun'};
var YAPI_KISA={cumle:'+ cümle',isim:'+ isim / -ing',fiil:'+ fiil',zarf:'cümleler arası',es:'virgülle bağlar'};
BAGM.forEach(function(m){
  var id='b-'+m.k;
  if(BAG.qs[m.k]&&BAG.qs[m.k].length){GRAM.q[id]=BAG.qs[m.k];TOPIC[id]={id:id,grp:'b',ad:'Bağlaçlar · '+m.ad,kisa:m.sub,not:''}}
});
function bagReady(){return BAG.groups.length&&BAGM.every(function(m){return GRAM.q['b-'+m.k]})}
function bagBest(k,l){var a=S.bg[k];return a&&typeof a[l]==='number'?a[l]:null}
function bagMark(s){return esc(s).replace(/\[(.+?)\]/g,'<mark>$1</mark>')}

function vBag(){

    var lv='';
    for(var l=0;l<3;l++){var b=bagBest(m.k,l);lv+='<button class="lvbtn'+(b===null?'':(b>=7?' ok':' try'))+'" data-act="bstart" data-k="'+m.k+'" data-l="'+l+'">'+BLV[l]+(b===null?'':'<small>'+b+'/10</small>')+'</button>'}
    return '<section class="bmode"><div class="bmhead">'+ui(m.icon,34)+'<span><b>'+m.ad+'</b><span>'+m.sub+'</span></span></div><div class="lvrow">'+lv+'</div></section>';
  }).join('');
  var chips=BAG.groups.map(function(g){return '<button class="gchip" data-act="bcards" data-g="'+g.id+'" style="--pc:var('+BCOL[g.id]+')">'+g.ad+'<small>'+g.items.length+'</small></button>'}).join('');
  return '<header class="top"><button class="x" data-act="tab" data-v="units" aria-label="Gramere dön">'+I.x+'</button><div class="brand"><span>Bağlaçlar</span></div></header><div class="body">'+
    '<section class="hero bhero"><div class="herotop"><p class="eyebrow">Zor cümleleri çözmenin anahtarı</p>'+ui('u-b-iliski',44,'heroart')+'</div>'+
    '<h1>Bağlaç atölyesi</h1><p class="hnote">Uzun bir cümlede neyin neden, neyin zıtlık, neyin koşul olduğunu bağlaçlar söyler. Önce kartlara bak, sonra alıştırmalara geç.</p></section>'+
    '<h2>Kartlar</h2><div class="gchips">'+chips+'</div>'+
    '<h2>Alıştırmalar</h2>'+modes+
    '<section class="bmode"><div class="bmhead">'+ui('t-match',34)+'<span><b>Ayır</b><span>Bağlaçları doğru kutuya sürükle</span></span></div>'+
    '<div class="lvrow"><button class="lvbtn" data-act="bsort" data-t="yapi">Yapıya göre</button><button class="lvbtn" data-act="bsort" data-t="iliski">Anlama göre</button></div></section>'+
    '<button class="btn pri" data-act="bmix">Karışık 10 soru'+I.go+'</button>'+

/* ---- Ayır: bağlaçları iki kutuya dağıt (dokun-seç-dokun ya da sürükle bırak) ---- */
var SR=null;
function sortRound(type){
  var all=[];BAG.groups.forEach(function(g){g.items.forEach(function(c){all.push({w:c.w,y:c.y,g:g.id,tr:c.tr})})});
  var bins,pick;
  if(type==='yapi'){
    bins=[{k:'cumle',ad:'+ özne + fiil'},{k:'isim',ad:'+ isim / -ing'}];
    pick=function(c){return c.y==='cumle'?0:(c.y==='isim'?1:-1)};
  }else{
    var gs=shuffle(BAG.groups.slice()).slice(0,2);
    bins=gs.map(function(g){return{k:g.id,ad:g.ad}});
    pick=function(c){return c.g===gs[0].id?0:(c.g===gs[1].id?1:-1)};
  }
  var a=shuffle(all.filter(function(c){return pick(c)===0})).slice(0,4),b=shuffle(all.filter(function(c){return pick(c)===1})).slice(0,4);
  return{type:type,bins:bins,tiles:shuffle(a.map(function(c){c.bin=0;return c}).concat(b.map(function(c){c.bin=1;return c}))),placed:{},sel:null,bad:null,miss:0};
}
function startSort(type){SR={type:type,round:0,rounds:3,miss:0,cur:sortRound(type),fin:false};Q=null;ST=null;M=null;GQ=null;view='bsort';render()}
function sortPlace(i,bin){
  var r=SR.cur,t=r.tiles[i];if(!t||r.placed[i]!=null)return;
  if(t.bin===bin){r.placed[i]=bin;r.sel=null;r.bad=null}
  else{r.miss++;SR.miss++;r.bad=i;r.sel=null;var cur=r;setTimeout(function(){if(SR&&SR.cur===cur&&cur.bad===i){cur.bad=null;if(view==='bsort')render(true)}},450)}
  render(true);
}
function vSort(){
  var r=SR.cur,done=Object.keys(r.placed).length===r.tiles.length;
  var tile=function(t,i){return '<button class="stile'+(r.sel===i?' sel':'')+(r.bad===i?' bad':'')+'" data-act="spick" data-i="'+i+'" lang="en">'+esc(t.w)+'</button>'};

var SD=null;
app.addEventListener('pointerdown',function(e){
  if(view!=='bsort'||!SR||SD)return;
  var t=e.target.closest('.stile');if(!t||(e.pointerType==='mouse'&&e.button!==0))return;
  var rc=t.getBoundingClientRect();
  SD={i:+t.getAttribute('data-i'),el:t,pid:e.pointerId,x0:e.clientX,y0:e.clientY,ox:e.clientX-rc.left,oy:e.clientY-rc.top,w:rc.width,ghost:null};
  window.addEventListener('pointermove',sdMove,{passive:false});window.addEventListener('pointerup',sdUp);window.addEventListener('pointercancel',sdEnd);
});
app.addEventListener('touchstart',function(e){if(e.cancelable&&view==='bsort'&&e.target.closest&&e.target.closest('.stile'))e.preventDefault()},{passive:false});
function sdBin(x,y){var bins=document.querySelectorAll('.sbin');for(var k=0;k<bins.length;k++){var r=bins[k].getBoundingClientRect();if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom)return k}return -1}
function sdMove(e){
  if(!SD||e.pointerId!==SD.pid)return;
  if(!SD.ghost){
    if(Math.abs(e.clientX-SD.x0)+Math.abs(e.clientY-SD.y0)<8)return;
    var g=SD.el.cloneNode(true);g.classList.add('ghost');g.style.width=SD.w+'px';document.body.appendChild(g);SD.ghost=g;SD.el.classList.add('lift');
  }
  e.preventDefault();
  SD.ghost.style.transform='translate('+(e.clientX-SD.ox)+'px,'+(e.clientY-SD.oy)+'px) rotate(-3deg)';
  var k=sdBin(e.clientX,e.clientY);[].forEach.call(document.querySelectorAll('.sbin'),function(b,j){b.classList.toggle('hot',j===k)});
}
function sdEnd(){
  if(!SD)return;
  if(SD.ghost&&SD.ghost.parentNode)SD.ghost.parentNode.removeChild(SD.ghost);
  window.removeEventListener('pointermove',sdMove);window.removeEventListener('pointerup',sdUp);window.removeEventListener('pointercancel',sdEnd);
  SD=null;
}
function sdUp(e){
  if(!SD||e.pointerId!==SD.pid)return;
  var d=SD,k=d.ghost?sdBin(e.clientX,e.clientY):-2;sdEnd();
  if(k===-2){SR.cur.sel=SR.cur.sel===d.i?null:d.i;render(true);return}   // dokunma: seç
  if(k>=0)sortPlace(d.i,k);else render(true);
}

/* ---- gramer seti: ünite testi, günün grameri, karışık test, ara tekrar ya da yanlışların tekrarı ---- */
var GMODE={test:'',daily:'Günün grameri',mixed:'Karışık test',rev:'Ara tekrar',retry:'Yanlışlar',bag:'Bağlaçlar'};
function gRun(mode,items,meta){
  meta=meta||{};
  GQ={mode:mode,items:items,i:0,order:shuffle([0,1,2,3,4]),picked:null,done:false,ok:false,right:0,wrong:[],hits:[],fin:false,fresh:false,
      id:meta.id||null,k:meta.k==null?null:meta.k,unitN:meta.unitN||0,key:meta.key||null,title:meta.title||GMODE[mode],again:meta.again||null,unitRight:null,bag:!!meta.bag};
  if(GQ.id)UV=GQ.id;
  Q=null;ST=null;M=null;view='gq';render();
}
function gStart(id,k){gRun('test',unitItems(id,k),{id:id,k:k,title:uLabel(id)+' · '+TESTS[k]})}
function gCurId(){return GQ.items[GQ.i][0]}
function gCur(){var it=GQ.items[GQ.i];return GRAM.q[it[0]][it[1]]}
function gTrack(it,ok){                                  // yanlış yapılan soru karışık tekrarlar için hatırlanır, doğru bilinince silinir
  var a=S.gw[it[0]]||(S.gw[it[0]]=[]),k=a.indexOf(it[1]);
  if(ok){if(k>=0)a.splice(k,1);if(!a.length)delete S.gw[it[0]]}
  else if(k<0)a.push(it[1]);
}
function gAnswer(pos){
  if(!GQ||GQ.done||GQ.fin)return;
  var q=gCur(),it=GQ.items[GQ.i];
  GQ.picked=pos;GQ.ok=pos>=0&&GQ.order[pos]===q[2];GQ.done=true;
  GQ.hits.push(GQ.ok?1:0);
  if(GQ.ok)GQ.right++;else GQ.wrong.push(it);
  gTrack(it,GQ.ok);
  GQ.fresh=true;render();GQ.fresh=false;
}
function gNext(){
  if(!GQ||!GQ.done||GQ.fin)return;
  if(GQ.i+1<GQ.items.length){GQ.i++;GQ.order=shuffle([0,1,2,3,4]);GQ.picked=null;GQ.done=false;GQ.ok=false;render();return}
  GQ.fin=true;
  if((GQ.mode==='test'||GQ.mode==='daily')&&GQ.id){        // ünite testinin soruları en iyi sonucu günceller
    var n=GQ.mode==='daily'?GQ.unitN:GQ.items.length,r=0;
    for(var k=0;k<n;k++)r+=GQ.hits[k];
    var a=S.g[GQ.id]||(S.g[GQ.id]=[null,null,null]);
    if(typeof a[GQ.k]!=='number'||r>a[GQ.k])a[GQ.k]=r;
    GQ.unitRight=r;
  }
  if(GQ.mode==='daily')S.gd={day:today(),right:GQ.right,n:GQ.items.length};
  if(GQ.mode==='rev'&&GQ.key&&(typeof S.gr[GQ.key]!=='number'||GQ.right>S.gr[GQ.key]))S.gr[GQ.key]=GQ.right;
  if(GQ.mode==='bag'&&GQ.key){var bb=S.bg[GQ.key[0]]||(S.bg[GQ.key[0]]=[null,null,null]);if(typeof bb[GQ.key[1]]!=='number'||GQ.right>bb[GQ.key[1]])bb[GQ.key[1]]=GQ.right}
  save();

function gText(q,fill){

  if(!n)return out+(fill&&q[4]!=='iliski'&&q[4]!=='anlam'?' <mark>'+esc(ans)+'</mark>':'');

    out+=(fill?'<mark>'+esc(bits.length===n?bits[k-1]:ans)+'</mark>':'<span class="blank" role="img" aria-label="boşluk"></span>')+parts[k];
  }
  return out;
}

/* ---- akış ---- */
function advance(){
  var ses=S.ses;
  if(!ses){view='home';render();return}
  if(matchDue(ses)){
    var ids=matchIds(ses);
    if(ids.length>=3){startMatch(ids,false);return}
    ses.md.push(ses.i);
  }
  if(sentDue(ses)){startSent(sentWord(ses),false,sentMode(ses));return}
  if(ses.i<ses.q.length&&kindAt(ses,ses.i)==='n'&&introDue(ses)){startIntro(ses);return}
  if(ses.i>=ses.q.length){
    if(!ses.fq){ses.fq=finalList(ses);ses.fi=0;ses.fres={};save()}
    if(ses.fi<ses.fq.length){Q=makeQ(ses.fq[ses.fi],'f','blank');ST=null;M=null;view='word';render();return}
    finish();Q=null;ST=null;M=null;celebrate=true;view='sum';render();return;
  }
  Q=makeQ(ses.q[ses.i],kindAt(ses,ses.i));ST=null;M=null;view='word';render();
}
function settle(){
  if(!Q.solo){if(Q.kind==='f')finalMark(Q.id,Q.ok);else mark(Q.id,Q.ok);save()}
  Q.fresh=true;render();Q.fresh=false;
}
function answer(k){
  if(!Q||Q.done||Q.fmt==='spell')return;
  Q.picked=k;Q.ok=k===Q.correct;Q.done=true;settle();
}
function answerSpell(giveUp){
  if(!Q||Q.done||!Q.b)return;
  var b=Q.b,tried=b.ans.map(function(i){return b.ch[i]}).join(Q.sep);
  Q.tried=giveUp?'':tried;Q.picked=giveUp?-1:0;Q.ok=!giveUp&&tried===Q.id;Q.done=true;settle();
}
function sentDone(ok){
  ST.ok=ok;ST.checked=true;
  if(!ST.solo&&S.ses){var ses=S.ses;if(ses.sd.indexOf(ses.i)<0)ses.sd.push(ses.i);ses.sN++;if(ok)ses.sOk++;save()}
  render();
}
function rnd(){return ORDER[Math.floor(Math.random()*ORDER.length)]}
var act={
  start:function(){var ses=ensureSession();if(!ses){render();return}if(ses.done){view='sum';render();return}advance()},
  home:function(){Q=null;ST=null;M=null;GQ=null;view='words';render()},

  bsort:function(b){startSort(b.getAttribute('data-t')==='yapi'?'yapi':'iliski')},
  spick:function(b){if(!SR)return;var i=+b.getAttribute('data-i');SR.cur.sel=SR.cur.sel===i?null:i;render(true)},
  sbin:function(b){if(!SR||SR.cur.sel==null)return;sortPlace(SR.cur.sel,+b.getAttribute('data-b'))},
  snext:function(){if(!SR)return;SR.round++;SR.cur=sortRound(SR.type);render()},
  inext:function(){if(!IN)return;if(IN.k+1<IN.ids.length){IN.k++;render();return}var ses=S.ses;(ses.intro||(ses.intro=[])).push(IN.at);IN=null;save();advance()},
  iprev:function(){if(IN&&IN.k>0){IN.k--;render()}},
  gwrong:function(){var w=wrongItems();if(w.length)gRun('retry',shuffle(w).slice(0,20),{title:'Yanlışlarım'})},
  unit:function(b){var id=b.getAttribute('data-id');if(!TOPIC[id])return;UV=id;GQ=null;view='unit';render()},
  gstart:function(b){var id=b.getAttribute('data-id');if(GRAM.q[id])gStart(id,+b.getAttribute('data-k')||0)},
  gpick:function(b){gAnswer(+b.getAttribute('data-k'))},
  gidk:function(){gAnswer(-1)},
  gnext:function(){gNext()},
  gretry:function(){if(GQ&&GQ.fin&&GQ.wrong.length)gRun('retry',GQ.wrong.slice(),{id:GQ.id,k:GQ.k,title:GQ.title+' · yanlışlar',bag:GQ.mode==='bag'||GQ.bag})},
  gdaily:function(){
    var p=dailyPlan();
    if(p.items.length)gRun('daily',p.items,{id:p.nt?p.nt.id:null,k:p.nt?p.nt.k:null,unitN:p.unitN,title:'Günün grameri'});
  },
  gmix:function(b){
    var n=+b.getAttribute('data-n')||TLEN,s=b.getAttribute('data-s')==='mine'?'mine':'all',items;
    if(s==='mine')items=reviewItems(n);
    else{var w=take(wrongItems(),Math.floor(n/2));items=w.concat(take(allItems(UNITS),n-w.length,w))}
    if(items.length>=Math.min(n,TLEN))gRun('mixed',shuffle(items),{title:'Karışık test',again:{n:n,s:s}});
  },
  grev:function(b){
    var key=b.getAttribute('data-key'),p=PARTS.filter(function(x){return x.rev===key})[0];
    if(p)gRun('rev',take(allItems(p.ids),REV_LEN),{key:key,title:p.revName});
  },
  pick:function(b){answer(+b.getAttribute('data-k'))},
  idk:function(){if(Q&&Q.fmt==='spell')answerSpell(true);else answer(-1)},
  pickS:function(b){if(!ST||ST.checked||ST.mode!=='complete')return;ST.picked=+b.getAttribute('data-k');sentDone(ST.picked===ST.correct)},
  idkS:function(){if(!ST||ST.checked||ST.mode!=='complete')return;ST.picked=-1;sentDone(false)},
  mL:function(b){mPick('L',b.getAttribute('data-id'))},
  mR:function(b){mPick('R',b.getAttribute('data-id'))},

  pin:function(b){togglePin(b.getAttribute('data-id'));render(true)},

  check:function(){
    if(view==='word'){if(Q&&Q.b&&!Q.done&&Q.b.ans.length===Q.b.need)answerSpell(false);return}
    if(!ST||ST.checked||ST.mode!=='order')return;
    var b=ST.b;
    if(b.ans.length<b.need)return;
    sentDone(b.ans.every(function(v,k){return b.ch[v]===b.ch[k]}));
  },
  sum:function(){view='sum';render()},
  nextday:function(){S.off=(S.off|0)+1;Q=null;ST=null;M=null;confirmReset=false;save();view='words';render()},
  auto:function(){
    var ses=ensureSession();if(!ses||ses.done)return;
    while(ses.i<ses.q.length)mark(ses.q[ses.i],Math.random()<0.7);
    var n=ses.q.length,k;
    for(k=HALF;k<=n;k+=BLOCK)if(ses.md.indexOf(k)<0)ses.md.push(k);
    for(k=BLOCK;k<=n;k+=BLOCK)if(ses.sd.indexOf(k)<0)ses.sd.push(k);
    if(ses.sd.indexOf(n)<0)ses.sd.push(n);
    ses.fq=finalList(ses);ses.fi=0;ses.fres={};
    while(ses.fi<ses.fq.length)finalMark(ses.fq[ses.fi],Math.random()<0.85);
    finish();Q=null;ST=null;M=null;celebrate=true;view='sum';render();
  },
  trysent:function(){startSent(rnd(),true,'order')},
  trycomp:function(){startSent(rnd(),true,'complete')},
  trymatch:function(){
    var out=[];
    shuffle(ORDER).forEach(function(id){if(out.length<HALF&&out.every(function(o){return!clash(BY[o],BY[id])}))out.push(id)});
    startMatch(out,true);
  },
  tryfmt:function(b){Q=makeQ(rnd(),'d',b.getAttribute('data-f'));Q.solo=true;ST=null;M=null;view='word';render()},
  reset:function(){confirmReset=true;render(true)},
  resetno:function(){confirmReset=false;render(true)},
  resetyes:function(){var r=S.rev|0;S=fresh();S.rev=r;confirmReset=false;Q=null;ST=null;M=null;save();view='words';render()}
};
app.addEventListener('click',function(e){
  if(e.detail===0&&AB()){                                   // klavyeyle etkinleştirilen parça
    var t=e.target.closest('.tile');
    if(t){var i=+t.getAttribute('data-i');tog(i);render(true);var n=app.querySelector('.tile[data-i="'+i+'"]');if(n)n.focus();return}
  }
  var b=e.target.closest('[data-act]');
  if(!b||b.disabled)return;

/* ---- parçaları dizme: dokun ya da sürükle bırak (cümle sıralama ve kelimeyi kurma aynı alanı kullanır) ---- */
var D=null;
function AB(){
  if(view==='sent'&&ST&&ST.b&&!ST.checked)return ST.b;
  if(view==='word'&&Q&&Q.b&&!Q.done)return Q.b;
  return null;
}
function tog(i){
  var b=AB();if(!b)return;
  var k=b.ans.indexOf(i);
  if(k>=0)b.ans.splice(k,1);else if(b.ans.length<b.need)b.ans.push(i);
}
app.addEventListener('pointerdown',function(e){
  if(D||!AB())return;
  var t=e.target.closest('.tile');
  if(!t||(e.pointerType==='mouse'&&e.button!==0))return;
  var r=t.getBoundingClientRect();
  D={i:+t.getAttribute('data-i'),el:t,pid:e.pointerId,x0:e.clientX,y0:e.clientY,ox:e.clientX-r.left,oy:e.clientY-r.top,w:r.width,drag:false,idx:null,ghost:null,ins:null};
  window.addEventListener('pointermove',dMove,{passive:false});
  window.addEventListener('pointerup',dUp);
  window.addEventListener('pointercancel',dCancel);
});
/* Parçaya dokunuşu sayfa üstlenir: tarayıcı sürüklemeyi kaydırma ya da savurma sanmaz, bırakır bırakmaz yapılan dokunuş yutulmaz */
app.addEventListener('touchstart',function(e){
  if(e.cancelable&&AB()&&e.target.closest&&e.target.closest('.tile'))e.preventDefault();
},{passive:false});
function dMove(e){
  if(!D||e.pointerId!==D.pid)return;
  if(!D.drag){
    if(Math.abs(e.clientX-D.x0)+Math.abs(e.clientY-D.y0)<8)return;
    D.drag=true;
    var g=D.el.cloneNode(true);g.classList.add('ghost');g.style.width=D.w+'px';document.body.appendChild(g);D.ghost=g;
    D.el.classList.add('lift');
    D.ins=document.createElement('i');D.ins.className='ins';
  }
  e.preventDefault();
  D.ghost.style.transform='translate('+(e.clientX-D.ox)+'px,'+(e.clientY-D.oy)+'px) rotate(-3deg)';
  var zone=document.getElementById('zone');if(!zone)return;
  var z=zone.getBoundingClientRect(),pad=28;
  var over=e.clientX>z.left-pad&&e.clientX<z.right+pad&&e.clientY>z.top-pad&&e.clientY<z.bottom+pad;
  if(!over){D.idx=null;if(D.ins.parentNode)D.ins.parentNode.removeChild(D.ins);zone.classList.remove('hot');return}
  var ts=[].slice.call(zone.querySelectorAll('.tile:not(.lift)')),idx=ts.length;
  if(ts.length){
    var y=Math.min(Math.max(e.clientY,ts[0].getBoundingClientRect().top+1),ts[ts.length-1].getBoundingClientRect().bottom-1);
    for(var k=0;k<ts.length;k++){
      var r=ts[k].getBoundingClientRect();
      if(y<r.top-4||(y<=r.bottom+4&&e.clientX<r.left+r.width/2)){idx=k;break}
    }
  }
  if(idx!==D.idx||!D.ins.parentNode){D.idx=idx;zone.insertBefore(D.ins,ts[idx]||null)}
  zone.classList.add('hot');
}
function dEnd(){
  if(D.ghost&&D.ghost.parentNode)D.ghost.parentNode.removeChild(D.ghost);
  if(D.ins&&D.ins.parentNode)D.ins.parentNode.removeChild(D.ins);
  window.removeEventListener('pointermove',dMove);
  window.removeEventListener('pointerup',dUp);
  window.removeEventListener('pointercancel',dCancel);
  D=null;
}
function dUp(e){
  if(!D||e.pointerId!==D.pid)return;
  var d=D,b;dEnd();
  b=AB();
  if(!b){render(true);return}
  if(!d.drag)tog(d.i);
  else if(d.idx!==null){
    var a=b.ans.filter(function(v){return v!==d.i});
    if(a.length<b.need){a.splice(d.idx,0,d.i);b.ans=a}       // alan doluysa yeni parça alınmaz
  }
  else if(b.ans.indexOf(d.i)>=0)b.ans=b.ans.filter(function(v){return v!==d.i});   // alanın dışına bırakılan parça geri döner
  render(true);
}
function dCancel(e){if(!D||e.pointerId!==D.pid)return;dEnd();render(true)}

/* ---- ilerlemeyi hesaba kaydet (yalnızca Artifact içinde; yoksa cihazda kalır) ---- */
var cloud=null,pushT=0,pushing=false,again=false,remoteRev=-1;
function pushCloud(){if(!cloud)return;clearTimeout(pushT);pushT=setTimeout(doPush,1500)}
function doPush(){
  if(!cloud)return;
  if(pushing){again=true;return}
  if((S.rev|0)===remoteRev)return;
  pushing=true;
  var rev=S.rev|0;
  cloud.set({rev:rev,json:JSON.stringify(S),at:new Date().toISOString()}).then(function(){remoteRev=rev},function(err){
    var c=err&&err.code;
    if(c!=='unavailable'&&c!=='resource_exhausted'){cloud=null;storeMode='local';if(view==='home')render(true)}
  }).then(function(){pushing=false;if(again){again=false;pushCloud()}});
}
function initCloud(){
  var c=window.claude;
  if(!c||typeof c.use!=='function')return;
  Promise.all([c.use('db'),c.use('user')]).then(function(r){
    var db=r[0],user=r[1];
    if(!db||!user)return;
    return user.id().then(function(uid){
      if(!uid)return;
      var ref=db.doc('data/users/'+uid+'/progress');
      var wait=new Promise(function(_,rej){setTimeout(function(){rej({code:'timeout'})},10000)});
      return Promise.race([ref.get(),wait]).then(function(snap){
        if(snap&&snap.exists){
          var doc=snap.data()||{};
          remoteRev=doc.rev|0;
          if(remoteRev>(S.rev|0)&&typeof doc.json==='string'){
            var o=null;try{o=JSON.parse(doc.json)}catch(e){}
            if(o&&o.v===1&&o.w){
              S=sanitize(o);
              try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
              Q=null;ST=null;M=null;GQ=null;view='home';
            }
          }
        }
        cloud=ref;storeMode='cloud';
        if((S.rev|0)>remoteRev)pushCloud();
        if(view==='home')render(true);
      });
    });
  }).catch(function(){});
}
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='hidden'&&cloud){clearTimeout(pushT);doPush()}
});

/* ---- Android sarmalayıcının geri tuşu: işlendiyse true döner ---- */
window.kelimeBack=function(){
  if(view==='home')return false;
  if(view==='gq'||view==='gres'){var uid=GQ&&GQ.id,isb=GQ&&(GQ.mode==='bag'||GQ.bag);GQ=null;if(isb)view='bag';else if(uid){UV=uid;view='unit'}else view='units'}
  else if(view==='bcards'||view==='bsort'){SR=null;view='bag'}
  else if(view==='bag')view='units';
  else if(view==='unit')view='units';
  else if(view==='words'||view==='units')view='home';
  else if(view==='intro'){IN=null;view='words'}
  else{Q=null;ST=null;M=null;GQ=null;view='words'}
  render();
  return true;
};

/* ---- başlangıç ---- */
function boot(d){
  var h=(location.hash||'').slice(1);
  if(h==='kelime')view='words';else if(h==='gramer')view='units';
  render();
  if(d&&d.view==='session'&&S.ses&&!S.ses.done)advance();
  initCloud();
  initVoice();
}
var hot=window.claude&&window.claude.hot;
try{if(hot&&hot.snapshot)hot.snapshot(function(){
  var solo=(Q&&Q.solo)||(ST&&ST.solo)||(M&&M.solo);
  return{view:(view==='word'||view==='sent'||view==='match'||view==='intro')&&!solo?'session':'home'};
})}catch(e){}
if(hot&&hot.ready)hot.ready(boot);else boot(hot&&hot.data||{});
})();
