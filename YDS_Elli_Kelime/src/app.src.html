/* ---- Ayır: bağlaçları iki kutuya dağıt (dokun-seç-dokun ya da sürükle bırak) ---- */
var SR=null;
function sortRound(type){
  var all=[];BAG.groups.forEach(function(g){g.items.forEach(function(c){all.push({w:c.w,y:c.y,g:g.id,tr:c.tr})})});
  var bins,pick;
  if(type==='yapi'){
    bins=[{k:'cumle',ad:'+ özne + fiil'},{k:'isim',ad:'+ isim / -ing'}];
    pick=function(c){return c.y==='cumle'?0:(c.y==='isim'?1:-1)};
  }else{
    var gs=shuffle(BAG.groups.slice()).slice(0,2);
    bins=gs.map(function(g){return{k:g.id,ad:g.ad}});
    pick=function(c){return c.g===gs[0].id?0:(c.g===gs[1].id?1:-1)};
  }
  var a=shuffle(all.filter(function(c){return pick(c)===0})).slice(0,4),b=shuffle(all.filter(function(c){return pick(c)===1})).slice(0,4);
  return{type:type,bins:bins,tiles:shuffle(a.map(function(c){c.bin=0;return c}).concat(b.map(function(c){c.bin=1;return c}))),placed:{},sel:null,bad:null,miss:0};
}
function startSort(type){SR={type:type,round:0,rounds:3,miss:0,cur:sortRound(type),fin:false};Q=null;ST=null;M=null;GQ=null;view='bsort';render()}
function sortPlace(i,bin){
  var r=SR.cur,t=r.tiles[i];if(!t||r.placed[i]!=null)return;
  var hit=t.bin===bin;
  if(hit){r.placed[i]=bin;r.sel=null;r.bad=null;sfx('match',Object.keys(r.placed).length)}
  else{r.miss++;SR.miss++;r.bad=i;r.sel=null;sfx('miss');var cur=r;setTimeout(function(){if(SR&&SR.cur===cur&&cur.bad===i){cur.bad=null;if(view==='bsort')render(true)}},450)}
  render(true);
  if(hit){var ins=app.querySelectorAll('.sbin')[bin];if(ins){var last=ins.querySelectorAll('.sin');burstAt(last[last.length-1]||ins,'spark',6)}}
  if(hit&&Object.keys(r.placed).length===r.tiles.length)burstSel('.res.ok>b svg','spark',9);
}
function vSort(){
  var r=SR.cur,done=Object.keys(r.placed).length===r.tiles.length;
  var tile=function(t,i){return '<button class="stile'+(r.sel===i?' sel':'')+(r.bad===i?' bad':'')+'" data-act="spick" data-i="'+i+'" lang="en">'+esc(t.w)+'</button>'};
  var bins=r.bins.map(function(b,k){
    var inside=r.tiles.map(function(t,i){return r.placed[i]===k?'<span class="sin"><b lang="en">'+esc(t.w)+'</b>'+(done?'<small>'+esc(t.tr)+'</small>':'')+'</span>':''}).join('');
    return '<button class="sbin" data-act="sbin" data-b="'+k+'"><span class="sbh">'+esc(b.ad)+'</span><span class="sbl">'+inside+'</span></button>';
  }).join('');
  var left=r.tiles.map(function(t,i){return r.placed[i]==null?tile(t,i):''}).join('');
  var last=SR.round+1>=SR.rounds;
  return '<header class="top"><button class="x" data-act="bag" aria-label="Bağlaçlara dön">'+I.x+'</button><div class="brand"><span>Ayır · '+(SR.type==='yapi'?'yapıya göre':'anlama göre')+'</span></div><span class="count">'+(SR.round+1)+' / '+SR.rounds+'</span></header>'+
    '<div class="body"><p class="ask">'+(done?'Tamam! Anlamlarıyla birlikte:':(SR.type==='yapi'?'Bağlacın ardından ne gelir? Kutusuna sürükle ya da önce bağlaca, sonra kutuya dokun.':'Bağlaç hangi anlamı katar? Kutusuna sürükle ya da önce bağlaca, sonra kutuya dokun.'))+'</p>'+
    '<div class="sbins">'+bins+'</div>'+(done?'':'<div class="stiles">'+left+'</div>')+
    (done?resPill(r.miss?'no':'ok',r.miss?r.miss+' yanlış deneme':'Hepsi doğru!',r.miss?'Ama hepsini yerine koydun.':'İlk denemede hepsi yerinde.',true):'')+'</div>'+
    '<footer class="foot">'+(done?(last?'<button class="btn sec narrow" data-act="bag">Bağlaçlar</button><button class="btn pri" data-act="bsort" data-t="'+SR.type+'" data-focus>Yeniden oyna</button>'
      :'<button class="btn pri" data-act="snext" data-focus>Sonraki tur'+I.go+'</button>'):'<button class="btn pri" disabled>'+(r.tiles.length-Object.keys(r.placed).length)+' bağlaç kaldı</button>')+'</footer>';
}
/* sürükleme: parçayı tutup kutunun üstüne bırak */
var SD=null;
app.addEventListener('pointerdown',function(e){
  if(view!=='bsort'||!SR||SD)return;
  var t=e.target.closest('.stile');if(!t||(e.pointerType==='mouse'&&e.button!==0))return;
  var rc=t.getBoundingClientRect();
  SD={i:+t.getAttribute('data-i'),el:t,pid:e.pointerId,x0:e.clientX,y0:e.clientY,ox:e.clientX-rc.left,oy:e.clientY-rc.top,w:rc.width,ghost:null};
  window.addEventListener('pointermove',sdMove,{passive:false});window.addEventListener('pointerup',sdUp);window.addEventListener('pointercancel',sdEnd);
});
app.addEventListener('touchstart',function(e){if(e.cancelable&&view==='bsort'&&e.target.closest&&e.target.closest('.stile'))e.preventDefault()},{passive:false});
function sdBin(x,y){var bins=document.querySelectorAll('.sbin');for(var k=0;k<bins.length;k++){var r=bins[k].getBoundingClientRect();if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom)return k}return -1}
function sdMove(e){
  if(!SD||e.pointerId!==SD.pid)return;
  if(!SD.ghost){
    if(Math.abs(e.clientX-SD.x0)+Math.abs(e.clientY-SD.y0)<8)return;
    var g=SD.el.cloneNode(true);g.classList.add('ghost');g.style.width=SD.w+'px';document.body.appendChild(g);SD.ghost=g;SD.el.classList.add('lift');
  }
  e.preventDefault();
  SD.ghost.style.transform='translate('+(e.clientX-SD.ox)+'px,'+(e.clientY-SD.oy)+'px) rotate(-3deg)';
  var k=sdBin(e.clientX,e.clientY);[].forEach.call(document.querySelectorAll('.sbin'),function(b,j){b.classList.toggle('hot',j===k)});
}
function sdEnd(){
  if(!SD)return;
  if(SD.ghost&&SD.ghost.parentNode)SD.ghost.parentNode.removeChild(SD.ghost);
  window.removeEventListener('pointermove',sdMove);window.removeEventListener('pointerup',sdUp);window.removeEventListener('pointercancel',sdEnd);
  SD=null;
}
function sdUp(e){
  if(!SD||e.pointerId!==SD.pid)return;
  var d=SD,k=d.ghost?sdBin(e.clientX,e.clientY):-2;sdEnd();
  if(k===-2){SR.cur.sel=SR.cur.sel===d.i?null:d.i;render(true);return}   // dokunma: seç
  if(k>=0)sortPlace(d.i,k);else render(true);
}

/* eşleşme oyununda kartı sürükleme */
var SW=null;
app.addEventListener('pointerdown',function(e){
  if(view!=='gift'||!G||G.game!=='swp'||G.stage!=='game'||!G.swp||G.swp.busy||SW)return;
  var c=e.target.closest('#swc');if(!c||(e.pointerType==='mouse'&&e.button!==0))return;
  SW={el:c,pid:e.pointerId,x0:e.clientX,dx:0};c.classList.remove('back');
  window.addEventListener('pointermove',swMove,{passive:false});window.addEventListener('pointerup',swUp);window.addEventListener('pointercancel',swUp);
});
app.addEventListener('touchstart',function(e){if(e.cancelable&&view==='gift'&&G&&G.game==='swp'&&e.target.closest&&e.target.closest('#swc'))e.preventDefault()},{passive:false});
function swSet(el,dx){el.style.setProperty('--dx',dx.toFixed(1));el.style.setProperty('--sy',Math.max(0,Math.min(1,dx/90)).toFixed(2));el.style.setProperty('--sn',Math.max(0,Math.min(1,-dx/90)).toFixed(2))}
function swMove(e){if(!SW||e.pointerId!==SW.pid)return;e.preventDefault();SW.dx=e.clientX-SW.x0;swSet(SW.el,SW.dx)}
function swUp(e){
  if(!SW||e.pointerId!==SW.pid)return;
  var d=SW;SW=null;
  window.removeEventListener('pointermove',swMove);window.removeEventListener('pointerup',swUp);window.removeEventListener('pointercancel',swUp);
  if(Math.abs(d.dx)>80){swDecide(d.dx>0);return}
  d.el.classList.add('back');swSet(d.el,0);                // yeterince kaydırılmadı: yerine döner
}
/* ---- gramer seti: ünite testi, günün grameri, karışık test, ara tekrar ya da yanlışların tekrarı ---- */
var GMODE={test:'',daily:'Günün grameri',mixed:'Karışık test',rev:'Ara tekrar',retry:'Yanlışlar',bag:'Bağlaçlar'};
function gRun(mode,items,meta){
  meta=meta||{};
  GQ={mode:mode,items:items,i:0,order:shuffle([0,1,2,3,4]),picked:null,done:false,ok:false,right:0,wrong:[],hits:[],fin:false,fresh:false,
      id:meta.id||null,k:meta.k==null?null:meta.k,unitN:meta.unitN||0,key:meta.key||null,title:meta.title||GMODE[mode],again:meta.again||null,unitRight:null,bag:!!meta.bag};
  if(GQ.id)UV=GQ.id;
  Q=null;ST=null;M=null;view='gq';render();
}
function gStart(id,k){gRun('test',unitItems(id,k),{id:id,k:k,title:uLabel(id)+' · '+TESTS[k]})}
function gCurId(){return GQ.items[GQ.i][0]}
function gCur(){var it=GQ.items[GQ.i];return GRAM.q[it[0]][it[1]]}
function gTrack(it,ok){                                  // yanlış yapılan soru karışık tekrarlar için hatırlanır, doğru bilinince silinir
  var a=S.gw[it[0]]||(S.gw[it[0]]=[]),k=a.indexOf(it[1]);
  if(ok){if(k>=0)a.splice(k,1);if(!a.length)delete S.gw[it[0]]}
  else if(k<0)a.push(it[1]);
}
function gAnswer(pos){
  if(!GQ||GQ.done||GQ.fin)return;
  var q=gCur(),it=GQ.items[GQ.i];
  GQ.picked=pos;GQ.ok=pos>=0&&GQ.order[pos]===q[2];GQ.done=true;
  GQ.hits.push(GQ.ok?1:0);
  if(GQ.ok)GQ.right++;else GQ.wrong.push(it);
  gTrack(it,GQ.ok);
  GQ.cb=GQ.ok?(GQ.cb|0)+1:0;
  var isb=GQ.mode==='bag'||GQ.bag;
  GQ.pr=GQ.ok?praise(GQ.cb):'';
  if(GQ.ok)sfx('ok',{n:GQ.cb,t:isb?'plk':'bell'});else sfx(pos<0?'idk':'no',isb?300:290);
  GQ.fresh=true;render(true);GQ.fresh=false;showFb();
  if(GQ.ok)fxRight(false);
}
function gNext(){
  if(!GQ||!GQ.done||GQ.fin)return;
  if(GQ.i+1<GQ.items.length){GQ.i++;GQ.order=shuffle([0,1,2,3,4]);GQ.picked=null;GQ.done=false;GQ.ok=false;sfx('slide');SLIDE='fwd';render();return}
  GQ.fin=true;
  if((GQ.mode==='test'||GQ.mode==='daily')&&GQ.id){        // ünite testinin soruları en iyi sonucu günceller
    var n=GQ.mode==='daily'?GQ.unitN:GQ.items.length,r=0;
    for(var k=0;k<n;k++)r+=GQ.hits[k];
    var a=S.g[GQ.id]||(S.g[GQ.id]=[null,null,null]);
    if(typeof a[GQ.k]==='number'&&r>a[GQ.k]){GQ.pb=a[GQ.k];GQ.pbn=r}   // önceki en iyiyi geçti: yeni rekor
    if(typeof a[GQ.k]!=='number'||r>a[GQ.k])a[GQ.k]=r;
    GQ.unitRight=r;
  }
  if(GQ.mode==='daily')S.gd={day:today(),right:GQ.right,n:GQ.items.length};
  if(GQ.mode==='rev'&&GQ.key){if(typeof S.gr[GQ.key]==='number'&&GQ.right>S.gr[GQ.key]){GQ.pb=S.gr[GQ.key];GQ.pbn=GQ.right}if(typeof S.gr[GQ.key]!=='number'||GQ.right>S.gr[GQ.key])S.gr[GQ.key]=GQ.right}
  if(GQ.mode==='bag'&&GQ.key){var bb=S.bg[GQ.key[0]]||(S.bg[GQ.key[0]]=[null,null,null]);if(typeof bb[GQ.key[1]]==='number'&&GQ.right>bb[GQ.key[1]]){GQ.pb=bb[GQ.key[1]];GQ.pbn=GQ.right}if(typeof bb[GQ.key[1]]!=='number'||GQ.right>bb[GQ.key[1]])bb[GQ.key[1]]=GQ.right}
  save();
  sfx(GQ.right>=GQ.items.length*0.7?'win':'star');

/* snd===false: sesi çağıran çalar (Başla düğmesi kendi sesini çalar) */
function advance(snd){
  var ses=S.ses,go=function(k){if(snd!==false)sfx(k)};
  if(speaking())hush();
  G=null;
  if(!ses){view='home';render();return}
  if(matchDue(ses)){
    var ids=matchIds(ses);
    if(ids.length>=3){go('swish');SLIDE='sec';startMatch(ids,false);return}
    ses.md.push(ses.i);
  }
  if(sentDue(ses)){go('swish');SLIDE='sec';startSent(sentWord(ses),false,sentMode(ses));return}
  if(giftDue(ses)){go('swish');SLIDE='sec';startGift(false);return}
  if(ses.i<ses.q.length&&kindAt(ses,ses.i)==='n'&&introDue(ses)){go('swish');SLIDE='sec';startIntro(ses);return}
  if(ses.i>=ses.q.length){
    if(!ses.fq){ses.fq=finalList(ses);ses.fi=0;ses.fres={};save()}
    if(ses.fi<ses.fq.length){if(ses.fi===0){go('swish');SLIDE='sec'}else{go('slide');SLIDE='fwd'}Q=makeQ(ses.fq[ses.fi],'f','blank');ST=null;M=null;view='word';render();return}
    finish();Q=null;ST=null;M=null;celebrate=true;sfx('win');view='sum';render();return;
  }
  go('slide');SLIDE='fwd';
  Q=makeQ(ses.q[ses.i],kindAt(ses,ses.i));ST=null;M=null;view='word';render();
}

  cloud.set({rev:rev,json:JSON.stringify(S),at:new Date().toISOString()}).then(function(){remoteRev=rev},function(err){
    var c=err&&err.code;
    if(c!=='unavailable'&&c!=='resource_exhausted'){cloud=null;storeMode='local';if(view==='home')render(true)}
  }).then(function(){pushing=false;if(again){again=false;pushCloud()}});
}
function initCloud(){
  var c=window.claude;
  if(!c||typeof c.use!=='function')return;
  Promise.all([c.use('db'),c.use('user')]).then(function(r){
    var db=r[0],user=r[1];
    if(!db||!user)return;
    return user.id().then(function(uid){
      if(!uid)return;
      var ref=db.doc('data/users/'+uid+'/progress');
      var wait=new Promise(function(_,rej){setTimeout(function(){rej({code:'timeout'})},10000)});
      return Promise.race([ref.get(),wait]).then(function(snap){
        if(snap&&snap.exists){
          var doc=snap.data()||{};
          remoteRev=doc.rev|0;
          if(remoteRev>(S.rev|0)&&typeof doc.json==='string'){
            var o=null;try{o=JSON.parse(doc.json)}catch(e){}
            if(o&&o.v===1&&o.w){
              S=sanitize(o);
              try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
              Q=null;ST=null;M=null;GQ=null;view='home';
            }
          }
        }
        cloud=ref;storeMode='cloud';
        if((S.rev|0)>remoteRev)pushCloud();
        if(view==='home')render(true);
      });
    });
  }).catch(function(){});
}
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='hidden'&&cloud){clearTimeout(pushT);doPush()}
});

/* ---- Android sarmalayıcının geri tuşu: işlendiyse true döner ---- */
window.kelimeBack=function(){
  if(view==='home')return false;
  if(speaking())hush();
  G=null;
  if(view==='gq'||view==='gres'){var uid=GQ&&GQ.id,isb=GQ&&(GQ.mode==='bag'||GQ.bag);GQ=null;if(isb)view='bag';else if(uid){UV=uid;view='unit'}else view='units'}
  else if(view==='bcards'||view==='bsort'){SR=null;view='bag'}
  else if(view==='vq'||view==='vres'){if(VS)clearTimeout(VS.tm);VS=null;view='vscan'}
  else if(view==='vscan')view='words';
  else if(view==='bag')view='units';
  else if(view==='unit')view='units';
  else if(view==='words'||view==='units')view='home';
  else if(view==='intro'){IN=null;view='words'}
  else{Q=null;ST=null;M=null;GQ=null;view='words'}
  render();
  return true;
};

/* ---- başlangıç ---- */
function boot(d){
  var h=(location.hash||'').slice(1);
  if(h==='kelime')view='words';else if(h==='gramer')view='units';
  render();
  if(d&&d.view==='session'&&S.ses&&!S.ses.done)advance();
  initCloud();
  initVoice();
}
var hot=window.claude&&window.claude.hot;
try{if(hot&&hot.snapshot)hot.snapshot(function(){
  var solo=(Q&&Q.solo)||(ST&&ST.solo)||(M&&M.solo)||(G&&G.solo);
  return{view:(view==='word'||view==='sent'||view==='match'||view==='intro'||view==='gift')&&!solo?'session':'home'};
})}catch(e){}
if(hot&&hot.ready)hot.ready(boot);else boot(hot&&hot.data||{});
})();
</script>
